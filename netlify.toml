# HTML은 항상 최신, CSS/JS는 버전 쿼리(?v=)로 캐시 무효화
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 클릭재킹·referrer 최소 방어 (AdSense script-src는 건드리지 않음)
# HSTS(max-age)는 Cloudflare SSL/TLS → Edge Certificates에서 설정
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"

