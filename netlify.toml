# Static SEO files win when present.
# Missing SEO folders fall back to board HTML (no Netlify 404).

[[redirects]]
  from = "/korea-news/*"
  to = "/korea-news.html"
  status = 200
  force = false

[[redirects]]
  from = "/sports-news/*"
  to = "/sports-news.html"
  status = 200
  force = false

# HTML은 항상 최신, CSS/JS는 버전 쿼리(?v=)로 캐시 무효화
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

