# @istudyeng 최신 Shorts → data/youtube-shorts.json
# 홈 「최신 영어 Shorts」 섹션이 이 JSON을 읽습니다.
#
# 스케줄: 매일 한국시간 오후 9시 (UTC 12:00)
# 수동: Actions → Sync YouTube Shorts → Run workflow
#   - D-day만: workflow_dispatch input today_only=true
name: Sync YouTube Shorts

on:
  schedule:
    # 09:00 PM KST = 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      today_only:
        description: 'D-day(한국시간 오늘) 업로드만 동기화'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      limit:
        description: '홈에 넣을 Shorts 개수'
        required: false
        default: '6'

permissions:
  contents: write

concurrency:
  group: sync-youtube-shorts
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Shorts feed
        env:
          TODAY_ONLY: ${{ github.event.inputs.today_only || 'false' }}
          LIMIT: ${{ github.event.inputs.limit || '6' }}
        run: |
          ARGS=(--limit "${LIMIT}")
          if [ "${TODAY_ONLY}" = "true" ]; then
            ARGS+=(--today)
          fi
          node backend/youtube_automation/sync-shorts.js "${ARGS[@]}"

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/youtube-shorts.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-shorts.json
          git commit -m "chore: sync latest YouTube Shorts for home"
          git push
