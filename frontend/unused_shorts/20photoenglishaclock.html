<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>photoenglish aclock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="20photoenglishaclock.css">
  <script src="20photoenglishaclock.js" defer></script>
</head>
<body>
  <main class="aclock-page">
    <header class="aclock-brand">
      <p class="aclock-kicker">20photoenglish</p>
      <h1 class="aclock-title">aclock</h1>
      <p class="aclock-sub">5 → 1 카운트 디자인 모음</p>
    </header>

    <section class="aclock-stage" id="aclock-stage" aria-live="polite">
      <div class="stage-atmosphere" aria-hidden="true"></div>
      <p class="stage-label" id="stage-label">Pop</p>

      <div class="clock clock-pop" data-style="pop" hidden>
        <span class="clock-num" data-num>5</span>
      </div>

      <div class="clock clock-ring" data-style="ring" hidden>
        <svg class="ring-svg" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-track" cx="60" cy="60" r="52"></circle>
          <circle class="ring-progress" cx="60" cy="60" r="52"
            pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
        </svg>
        <span class="clock-num" data-num>5</span>
      </div>

      <div class="clock clock-flip" data-style="flip" hidden>
        <div class="flip-digit" aria-hidden="true">
          <div class="flip-panel flip-base-top"><span class="flip-num" data-base-top>5</span></div>
          <div class="flip-panel flip-base-bottom"><span class="flip-num" data-base-bottom>5</span></div>
          <div class="flip-panel flip-flap-top"><span class="flip-num" data-flap-top>5</span></div>
          <div class="flip-panel flip-flap-bottom"><span class="flip-num" data-flap-bottom>4</span></div>
        </div>
      </div>

      <div class="clock clock-stamp" data-style="stamp" hidden>
        <span class="stamp-burst" aria-hidden="true"></span>
        <span class="stamp-burst stamp-burst-2" aria-hidden="true"></span>
        <span class="clock-num" data-num>5</span>
      </div>

      <div class="clock clock-split" data-style="split" hidden>
        <div class="split-frame">
          <span class="split-pane split-left"><span class="split-glyph" data-num>5</span></span>
          <span class="split-pane split-right"><span class="split-glyph" data-num-mirror>5</span></span>
        </div>
      </div>

      <div class="clock clock-orbit" data-style="orbit" hidden>
        <div class="orbit-ring" aria-hidden="true">
          <i data-dot="0"></i><i data-dot="1"></i><i data-dot="2"></i><i data-dot="3"></i><i data-dot="4"></i>
        </div>
        <span class="clock-num" data-num>5</span>
      </div>

      <div class="clock clock-morph" data-style="morph" hidden>
        <span class="morph-aura" aria-hidden="true"></span>
        <span class="clock-num" data-num>5</span>
      </div>

      <div class="clock clock-stack" data-style="stack" hidden>
        <span class="stack-prev" data-num-prev hidden></span>
        <span class="clock-num" data-num>5</span>
      </div>

      <div class="clock clock-glitch" data-style="glitch" hidden>
        <span class="glitch-layer glitch-r" data-num-r aria-hidden="true">5</span>
        <span class="glitch-layer glitch-b" data-num-b aria-hidden="true">5</span>
        <span class="clock-num" data-num>5</span>
      </div>

      <div class="clock clock-zoom" data-style="zoom" hidden>
        <span class="zoom-ghost" data-num-ghost aria-hidden="true">5</span>
        <span class="clock-num" data-num>5</span>
      </div>

      <div class="clock clock-bars" data-style="bars" hidden>
        <div class="bars-track" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </div>
        <span class="clock-num" data-num>5</span>
      </div>
    </section>

    <nav class="aclock-styles" aria-label="카운트 스타일">
      <button type="button" class="style-btn is-active" data-style="pop" data-label="Pop">Pop</button>
      <button type="button" class="style-btn" data-style="ring" data-label="Ring">Ring</button>
      <button type="button" class="style-btn" data-style="flip" data-label="Flip">Flip</button>
      <button type="button" class="style-btn" data-style="stamp" data-label="Stamp">Stamp</button>
      <button type="button" class="style-btn" data-style="split" data-label="Split">Split</button>
      <button type="button" class="style-btn" data-style="orbit" data-label="Orbit">Orbit</button>
      <button type="button" class="style-btn" data-style="morph" data-label="Morph">Morph</button>
      <button type="button" class="style-btn" data-style="stack" data-label="Stack">Stack</button>
      <button type="button" class="style-btn" data-style="glitch" data-label="Glitch">Glitch</button>
      <button type="button" class="style-btn" data-style="zoom" data-label="Zoom">Zoom</button>
      <button type="button" class="style-btn" data-style="bars" data-label="Bars">Bars</button>
    </nav>

    <div class="aclock-controls">
      <button type="button" id="play-btn">play 5→1</button>
      <button type="button" id="play-all-btn" class="ghost">all styles</button>
      <button type="button" id="stop-btn" class="ghost" disabled>stop</button>
    </div>
  </main>
</body>
</html>
