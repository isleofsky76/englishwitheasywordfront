<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>Memo</title>
  <link rel="stylesheet" href="page5.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6108574897789788" crossorigin="anonymous"></script>
  <script src="clock.js"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
      <div class="container-fluid">
          <a class="navbar-brand" href="#">Memos</a>
          <div class="d-flex">   
              <span class="emoji-tooltip me-3" title="Save">
                  <span class="tooltip-text">Save</span>
                  💾
              </span>
              <span class="emoji-tooltip me-3" title="Download">
                  <span class="tooltip-text">Download</span>
                  ⬇️
              </span>
              <span class="emoji-tooltip me-3" title="Copy">
                  <span class="tooltip-text">Copy</span>
                  📋
              </span>
              <span class="emoji-tooltip me-3" title="Add Row">
                  <span class="tooltip-text">Add Row</span>
                  ➕
              </span>
              <span class="emoji-tooltip me-3" title="Empty Row">
                  <span class="tooltip-text">Empty Row</span>
                  🧹
              </span>
              <span class="emoji-tooltip me-3" title="Delete Row">
                  <span class="tooltip-text">Delete Row</span>
                  🗑️
              </span>
          </div>
          <a class="navbar-brand ms-auto" href="https://englisheasystudy.com/">Home</a>
      </div>
    </nav>

    
    <div class="container mt-5 pt-5">
      <div class="table-container">
        <table id="taskTable" class="table">
          <thead>
          </thead>
          <tbody>
            <!-- Rows will be added dynamically -->
          </tbody>
        </table>
      </div>
      <div id="downloadLinkContainer"></div> <!-- 다운로드 링크를 추가할 컨테이너 -->
    </div>


    <div class="filter-container-wrapper">
      <div class="filter-container">
          <label for="cityFilter">Current Time:</label>
          <select id="cityFilter" class="form-select">
              <option value="서울">Seoul</option>
              <option value="뉴욕">New York</option>
              <option value="런던">London</option>
              <option value="파리">Paris</option>
              <option value="도쿄">Tokyo</option>
              <option value="베이징">Beijing</option>
              <option value="모스크바">Moscow</option>
              <option value="제네바">Geneva</option>
          </select>
          <div id="selectedTime"></div>
      </div>
    </div>
    <div id="downloadLinkContainer"></div> <!-- 다운로드 링크를 추가할 컨테이너 -->


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="page5.js"></script>
</body>
</html>
