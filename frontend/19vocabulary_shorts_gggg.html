<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>19vocabulary_shorts_gggg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Nanum+Gothic&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="19vocabulary_shorts_gggg.css">
  <link rel="preload" as="image" href="resources/bg.jpeg">
  <link rel="preload" as="image" href="resources/news.jpeg">
  <script src="19vocabulary_shorts_gggg.js" defer></script>
</head>
<body>
  <div id="page-bg" aria-hidden="true"></div>
  <div id="page-bg-wash" aria-hidden="true"></div>
  <div id="page-bg-logo-mask" aria-hidden="true"></div>
  <img id="word-flash-img" alt="" aria-hidden="true">

  <div id="progress-panel" class="progress-panel" hidden>
    <div id="progress-bar" class="progress-bar">
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
      </div>
      <span id="progress-text" class="progress-text">0/0 단어</span>
    </div>
    <p class="series-label" id="series-label"></p>
  </div>

  <div id="badge-toast" class="badge-toast" aria-live="polite" hidden></div>

  <main class="wrapper">
    <section class="content">
      <header class="page-header">
        <h1 id="page-title"></h1>
      </header>
      <div id="ticker" class="ticker" aria-live="polite"></div>
    </section>
  </main>

  <div class="controls" id="quiz-controls">
    <button id="autoplay-btn" type="button">auto play</button>
  </div>
</body>
</html>
