<!DOCTYPE html>
<html lang="ko" data-example-color-scheme="1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>22news_sentence_Mark — 구절별 다색 예문 샘플</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Comic+Neue:ital,wght@0,400;0,700;1,400;1,700&family=Nanum+Gothic&family=Noto+Serif+KR:wght@400;600;700&family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="22news_sentence_Mark.css?v=42">
    <style>
        @font-face {
            font-family: 'NanumBarunPen';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumBarunpen.woff') format('woff');
            font-weight: normal;
            font-display: swap;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
            background: #111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow: hidden;
        }

        .page-hint {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.5;
            max-width: 540px;
        }

        .page-hint kbd {
            display: inline-block;
            padding: 1px 7px;
            border-radius: 4px;
            background: #222;
            border: 1px solid #444;
            font-size: 12px;
            color: #ccc;
        }

        .tab-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.06);
            color: #bbb;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .tab-btn.active {
            color: #ADFF2F;
            border-color: rgba(173,255,47,0.45);
            background: rgba(173,255,47,0.12);
        }

        .viewer-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .shorts-frame {
            position: relative;
            width: min(calc(100vw - 120px), 405px);
            aspect-ratio: 9 / 16;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.08);
            touch-action: pan-y;
            user-select: none;
            flex-shrink: 0;
        }

        .nav-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-btn:hover:not(:disabled) {
            background: rgba(173, 255, 47, 0.25);
            border-color: rgba(173, 255, 47, 0.5);
        }

        .nav-btn:disabled { opacity: 0.25; cursor: default; }

        .carousel-track {
            display: flex;
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .slide {
            flex: 0 0 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px 16px 18px;
            background: #2F3543;
            overflow: hidden;
        }

        .slide-badge {
            align-self: flex-start;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 8px;
            color: #FFE566;
            background: rgba(255,229,102,0.12);
            border: 1px solid rgba(255,229,102,0.3);
        }

        .slide-badge.font {
            color: #7df8df;
            background: rgba(125,248,223,0.1);
            border-color: rgba(125,248,223,0.28);
        }

        .slide-badge.palette {
            color: #c4b5fd;
            background: rgba(196,181,253,0.12);
            border-color: rgba(196,181,253,0.3);
        }

        .slide-label {
            font-size: 12px;
            font-weight: 600;
            color: #B0BEC5;
            text-align: center;
            margin-bottom: 14px;
        }

        .slide-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
            min-height: 0;
        }

        /* Mark.css syn-example 규칙 + 구절별 inline color */
        .font-name-tag {
            display: inline-block;
            align-self: flex-start;
            font-size: 13px;
            font-weight: 700;
            color: #ADFF2F;
            background: rgba(173, 255, 47, 0.1);
            border: 1px solid rgba(173, 255, 47, 0.35);
            border-radius: 8px;
            padding: 5px 10px;
            margin-bottom: 10px;
            letter-spacing: 0.02em;
            font-family: 'Pretendard', sans-serif;
        }

        .font-name-tag .font-style-sub {
            display: block;
            font-size: 10px;
            font-weight: 500;
            color: rgba(173, 255, 47, 0.75);
            margin-top: 2px;
        }

        #syn-example-sample,
        .slide [id^="syn-example-"]:not([id^="syn-example-ko"]) {
            font-family: var(--font-example-en, 'NanumBarunPen', 'Poppins', sans-serif) !important;
            font-size: 21px !important;
            line-height: 1.85 !important;
            padding: 8px 8px 10px 0 !important;
            text-shadow: none !important;
        }

        .slide [id^="syn-example-"] .example-word {
            font-weight: 660 !important;
        }

        .slide [id^="syn-example-"] .syn-gloss-example-phrase {
            text-decoration-color: var(--example-underline, #D98600) !important;
        }

        .slide-ko-chunks {
            font-family: var(--font-example-ko);
            font-size: 15px;
            line-height: 1.55;
            font-weight: 580;
        }

        .slide-ko-chunks .ko-chunk {
            font-weight: 580;
        }

        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 4px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            color: rgba(245,239,231,0.55);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .slide-meta {
            margin-top: auto;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .slide-title {
            font-size: 16px;
            font-weight: 700;
            color: #F5EFE7;
            margin-bottom: 2px;
        }

        .slide-desc {
            font-size: 11px;
            color: rgba(245,239,231,0.6);
            line-height: 1.45;
        }

        .slide-counter {
            font-size: 11px;
            color: rgba(176,190,197,0.8);
            margin-top: 4px;
        }

        .controls {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .dots {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            justify-content: center;
            max-width: 360px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,0.2);
            cursor: pointer;
            padding: 0;
        }

        .dot.active { background: #ADFF2F; transform: scale(1.2); }

        .bottom-nav { display: flex; gap: 12px; }

        .bottom-nav .nav-btn-wide {
            padding: 10px 22px;
            width: auto;
            height: auto;
            border-radius: 24px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 600;
        }

        /* 폰트 오버라이드 */
        .slide[data-font="poppins"]     { --font-example-en: 'Poppins', sans-serif; }
        .slide[data-font="montserrat"]  { --font-example-en: 'Montserrat', sans-serif; }
        .slide[data-font="caveat"]      { --font-example-en: 'Caveat', cursive; }
        .slide[data-font="comic"]       { --font-example-en: 'Comic Neue', sans-serif; }
        .slide[data-font="varela"]      { --font-example-en: 'Varela Round', sans-serif; }
        .slide[data-font="nanumbarun"]  { --font-example-en: 'NanumBarunPen', sans-serif; }
        .slide[data-font="pretendard-en"] { --font-example-en: 'Pretendard', sans-serif; }
    </style>
</head>
<body>
    <p class="page-hint">
        구절(exampleSyntax)마다 다른 색 · gloss 단어 밑줄 · AI 예문 고정<br>
        <kbd>←</kbd> <kbd>→</kbd> · 스와이프 · 팔레트 / 폰트 비교
    </p>

    <div class="tab-row">
        <button type="button" class="tab-btn active" data-filter="all">전체</button>
        <button type="button" class="tab-btn" data-filter="palette">색 팔레트</button>
        <button type="button" class="tab-btn" data-filter="font">폰트</button>
    </div>

    <div class="viewer-row">
        <button type="button" class="nav-btn" id="btn-prev" aria-label="이전">‹</button>
        <div class="shorts-frame" id="shorts-frame">
            <div class="carousel-track" id="carousel-track"></div>
        </div>
        <button type="button" class="nav-btn" id="btn-next" aria-label="다음">›</button>
    </div>

    <div class="controls">
        <div class="dots" id="dots"></div>
        <div class="bottom-nav">
            <button type="button" class="nav-btn nav-btn-wide" id="btn-prev2">‹ 이전</button>
            <button type="button" class="nav-btn nav-btn-wide" id="btn-next2">다음 ›</button>
        </div>
    </div>

    <script>
        /* Mark.js words[0] 와 동일 */
        const EXAMPLE_SENTENCE = 'If AI becomes an increasingly satisfying and low-cost substitute for human intimacy, young people could become less motivated to pursue real-world romantic relationships, marriage and parenthood.';
        const EXAMPLE_SYNTAX = [
            { text: 'If AI becomes', role: 'AI가 ~가 된다면' },
            { text: 'an increasingly satisfying and low-cost substitute', role: '점점 더 만족스럽고 저렴한 대체물이' },
            { text: 'for human intimacy', role: '인간적 친밀감의' },
            { text: 'young people could become less motivated', role: '젊은 사람들은 덜 동기부여될 수 있습니다' },
            { text: 'to pursue', role: '추구하는 데' },
            { text: 'real-world romantic relationships', role: '현실 세계의 연애 관계를' },
            { text: 'marriage and parenthood', role: '결혼과 부모 됨을' },
        ];
        const GLOSS_WORDS = ['satisfying', 'substitute', 'intimacy', 'motivated', 'pursue', 'parenthood'];
        const KO_CHUNKS = [
            'AI가', '인간적 친밀감의', '점점 더 만족스럽고', '저렴한 대체물이 된다면,',
            '젊은 사람들은', '현실 세계의', '연애 관계,', '결혼,', '부모 됨을',
            '추구하려는 동기가', '줄어들 수 있습니다.',
        ];
        /* KO chunk → syntax seg 매핑 (exampleSyntax 순서) */
        const KO_CHUNK_SEG = [0, 2, 1, 1, 3, 5, 5, 6, 6, 4, 3];

        /* Mark.js EXAMPLE_SYNTAX_ORDER_COLORS */
        const PALETTE_MARK = [
            '#6ECFF5', '#FFB86B', '#7AE4B8', '#B9A8FF',
            '#FF8FA3', '#FFE066', '#FF7EB8',
        ];

        const PALETTE_PASTEL = [
            '#89CFF0', '#FFCC99', '#98D8AA', '#C5B4E3',
            '#FFB3BA', '#FFF3A3', '#FF9EC4',
        ];

        const PALETTE_VIVID = [
            '#00B4FF', '#FF9500', '#00E676', '#9C6BFF',
            '#FF4081', '#FFEA00', '#FF6090',
        ];

        const PALETTE_COOL = [
            '#64B5F6', '#4DD0E1', '#80CBC4', '#7986CB',
            '#9575CD', '#4FC3F7', '#26C6DA',
        ];

        const PALETTE_WARM = [
            '#FFD54F', '#FFB74D', '#FF8A65', '#FFAB91',
            '#F48FB1', '#FFE082', '#FFCC80',
        ];

        const DEFAULT_EN_FONT = {
            id: 'nanumbarun',
            label: 'NanumBarunPen',
            style: 'Handwriting · Pen script (나눔바른펜)',
            stack: "'NanumBarunPen', 'Poppins', sans-serif",
        };

        const PALETTES = [
            { id: 'mark',   label: 'Mark 현재', colors: PALETTE_MARK, note: '22news_sentence_Mark.js EXAMPLE_SYNTAX_ORDER_COLORS' },
            { id: 'pastel', label: '파스텔', colors: PALETTE_PASTEL, note: '채도 낮춘 파스텔 — 눈 편함' },
            { id: 'vivid',  label: 'Vivid 선명', colors: PALETTE_VIVID, note: '고채도 · 쇼츠 대비 강함' },
            { id: 'cool',   label: '쿨톤', colors: PALETTE_COOL, note: '블루·민트·퍼플 계열 통일' },
            { id: 'warm',   label: '웜톤', colors: PALETTE_WARM, note: '골드·오렌지·피치 계열 통일' },
        ];

        const FONTS = [
            { id: 'nanumbarun', label: 'NanumBarunPen', style: 'Handwriting · Pen script', note: 'Mark 기본 영문 예문 폰트 (--font-example-en)' },
            { id: 'poppins',    label: 'Poppins',       style: 'Sans-serif · Geometric', note: '머리줄 en·고딕 계열 (--font-en)' },
            { id: 'montserrat', label: 'Montserrat',    style: 'Sans-serif · Grotesque', note: '산세리프 · 굵기 선명' },
            { id: 'varela',     label: 'Varela Round',  style: 'Sans-serif · Rounded', note: '둥근 산세리프 · 스크린샷 유사' },
            { id: 'caveat',     label: 'Caveat',        style: 'Handwriting · Script', note: '손글씨 cursive' },
            { id: 'comic',      label: 'Comic Neue',    style: 'Sans-serif · Comic', note: '만화체 · 가벼운 톤' },
            { id: 'pretendard-en', label: 'Pretendard', style: 'Sans-serif · Neo-gothic', note: '한글과 통일 고딕' },
        ];

        function escapeHtml(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function normWord(w) {
            return w.replace(/[^\w-]/g, '').toLowerCase();
        }

        /** exampleSyntax 구문 → 단어별 segIndex (Mark.js assignSyntaxSegmentMatchesToWords 간소화) */
        function assignSegIndices(sentence, syntaxList) {
            const words = sentence.trim().split(/\s+/).filter(Boolean);
            const segIndexByWord = new Array(words.length).fill(-1);
            const used = new Set();

            syntaxList.forEach((seg, segIdx) => {
                const segWords = String(seg.text || '').trim().split(/\s+/).filter(Boolean);
                if (!segWords.length) return;
                const segNorms = segWords.map(normWord);
                for (let i = 0; i <= words.length - segWords.length; i++) {
                    if (segIndexByWord[i] >= 0) continue;
                    let match = true;
                    for (let j = 0; j < segWords.length; j++) {
                        if (used.has(i + j) || normWord(words[i + j]) !== segNorms[j]) {
                            match = false;
                            break;
                        }
                    }
                    if (match) {
                        for (let j = 0; j < segWords.length; j++) {
                            segIndexByWord[i + j] = segIdx;
                            used.add(i + j);
                        }
                        break;
                    }
                }
            });
            return { words, segIndexByWord };
        }

        function isGlossWord(word) {
            const n = normWord(word);
            return GLOSS_WORDS.some((g) => n === g || n.startsWith(g));
        }

        function buildMultiColorHtml(sentence, colors) {
            const { words, segIndexByWord } = assignSegIndices(sentence, EXAMPLE_SYNTAX);
            const parts = words.map((word, i) => {
                const segIdx = segIndexByWord[i] ?? 0;
                const color = colors[segIdx % colors.length];
                const inner = `<span class="example-word syn-ex-role" data-syntax-seg="${segIdx}" style="color:${color} !important;">${escapeHtml(word)}</span>`;
                if (isGlossWord(word)) {
                    return `<span class="syn-gloss-example-phrase syn-gloss-example-phrase--stem" style="color:${color} !important;">${inner}</span>`;
                }
                return inner;
            });
            return parts.join(' ');
        }

        function buildKoHtml(colors) {
            return KO_CHUNKS.map((chunk, i) => {
                const segIdx = KO_CHUNK_SEG[i] ?? 0;
                const color = colors[segIdx % colors.length];
                return `<span class="ko-chunk" style="color:${color};">${escapeHtml(chunk)}</span>`;
            }).join(' ');
        }

        function buildLegend(colors) {
            return EXAMPLE_SYNTAX.map((seg, i) => {
                const c = colors[i % colors.length];
                const short = String(seg.role || seg.text).slice(0, 12);
                return `<span class="legend-item"><span class="legend-dot" style="background:${c}"></span>${i + 1}. ${escapeHtml(short)}</span>`;
            }).join('');
        }

        function buildFontNameTag(fontLabel, fontStyle) {
            return (
                `<div class="font-name-tag">` +
                `EN Font: <strong>${escapeHtml(fontLabel)}</strong>` +
                `<span class="font-style-sub">${escapeHtml(fontStyle)}</span>` +
                `</div>`
            );
        }

        function buildSlide(opts) {
            const { type, title, note, colors, fontId, fontLabel, fontStyle, badgeClass, badgeText } = opts;
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.dataset.type = type;
            if (fontId) slide.dataset.font = fontId;

            const enHtml = buildMultiColorHtml(EXAMPLE_SENTENCE, colors);
            const koHtml = buildKoHtml(colors);
            const legend = buildLegend(colors);
            const fontTag = buildFontNameTag(fontLabel || DEFAULT_EN_FONT.label, fontStyle || DEFAULT_EN_FONT.style);

            slide.innerHTML = `
                <span class="slide-badge ${badgeClass}">${badgeText}</span>
                <div class="slide-label">구절별 다색 · exampleSyntax</div>
                <div class="slide-body">
                    ${fontTag}
                    <div id="syn-example-sample">${enHtml}</div>
                    <div class="slide-ko-chunks">${koHtml}</div>
                    <div class="legend">${legend}</div>
                </div>
                <div class="slide-meta">
                    <div class="slide-title">${escapeHtml(title)}</div>
                    <div class="slide-desc">${escapeHtml(note)}<br><span style="color:#ADFF2F;">EN: ${escapeHtml(fontLabel || DEFAULT_EN_FONT.label)}</span> · ${escapeHtml(fontStyle || DEFAULT_EN_FONT.style)}</div>
                    <div class="slide-counter"></div>
                </div>
            `;
            return slide;
        }

        let allSlides = [];
        let visibleSlides = [];
        let current = 0;
        let filter = 'all';
        let touchStartX = 0;

        const track = document.getElementById('carousel-track');
        const dotsEl = document.getElementById('dots');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnPrev2 = document.getElementById('btn-prev2');
        const btnNext2 = document.getElementById('btn-next2');
        const frame = document.getElementById('shorts-frame');

        function buildAllSlides() {
            allSlides = [];

            PALETTES.forEach((p) => {
                allSlides.push(buildSlide({
                    type: 'palette',
                    title: `색 팔레트 · ${p.label}`,
                    note: p.note,
                    colors: p.colors,
                    fontLabel: DEFAULT_EN_FONT.label,
                    fontStyle: DEFAULT_EN_FONT.style,
                    badgeClass: 'palette',
                    badgeText: 'SYNTAX COLORS',
                }));
            });

            FONTS.forEach((f) => {
                allSlides.push(buildSlide({
                    type: 'font',
                    title: `EN Font · ${f.label}`,
                    note: `${f.note} · Mark 색 팔레트 고정`,
                    colors: PALETTE_MARK,
                    fontId: f.id,
                    fontLabel: f.label,
                    fontStyle: f.style,
                    badgeClass: 'font',
                    badgeText: `FONT: ${f.label}`,
                }));
            });
        }

        function applyFilter(nextFilter) {
            filter = nextFilter;
            document.querySelectorAll('.tab-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            visibleSlides = allSlides.filter((s) => filter === 'all' || s.dataset.type === filter);
            track.innerHTML = '';
            visibleSlides.forEach((s) => track.appendChild(s));
            rebuildDots();
            goTo(0);
        }

        function rebuildDots() {
            dotsEl.innerHTML = '';
            visibleSlides.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.className = 'dot' + (i === 0 ? ' active' : '');
                dot.type = 'button';
                dot.addEventListener('click', () => goTo(i));
                dotsEl.appendChild(dot);
            });
        }

        function goTo(index) {
            current = Math.max(0, Math.min(visibleSlides.length - 1, index));
            track.style.transform = `translateX(-${current * 100}%)`;
            dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
            const atStart = current === 0;
            const atEnd = current === visibleSlides.length - 1;
            btnPrev.disabled = atStart;
            btnNext.disabled = atEnd;
            btnPrev2.disabled = atStart;
            btnNext2.disabled = atEnd;
            const counter = visibleSlides[current]?.querySelector('.slide-counter');
            if (counter) counter.textContent = `${String(current + 1).padStart(2, '0')} / ${String(visibleSlides.length).padStart(2, '0')}`;
        }

        function next() { goTo(current + 1); }
        function prev() { goTo(current - 1); }

        document.querySelectorAll('.tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => applyFilter(btn.dataset.filter));
        });
        btnPrev.addEventListener('click', prev);
        btnNext.addEventListener('click', next);
        btnPrev2.addEventListener('click', prev);
        btnNext2.addEventListener('click', next);

        frame.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
        frame.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(dx) < 40) return;
            dx < 0 ? next() : prev();
        }, { passive: true });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') next();
            if (e.key === 'ArrowLeft') prev();
        });

        buildAllSlides();
        applyFilter('all');
    </script>
</body>
</html>
