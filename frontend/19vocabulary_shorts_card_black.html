<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#06221c" />
  <title>News Voca Shorts Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    @font-face {
      font-family: "NanumBarunPen";
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/NanumBarunpen.woff") format("woff");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <link rel="stylesheet" href="19vocabulary_shorts_card_black.css?v=20260417-36" />
</head>
<body>
  <div class="shorts-frame" id="shortsCard">
    <div class="grain"></div>
    <img class="card-logo" src="resources/logo.jpg" alt="" width="52" height="52" decoding="async" />
    <div class="content">
      <div class="top-label-wrap">
        <span class="top-line"></span>
        <div class="top-label" id="category"></div>
        <span class="top-line"></span>
      </div>

      <div class="card-body">
        <div class="word" id="word"></div>
        <div class="meaning-badge" id="meaning"></div>

        <div class="divider"></div>

        <div class="example-split">
          <div class="example-half example-half--en">
            <div class="sentence" id="sentence"></div>
          </div>
          <div class="example-half example-half--ko">
            <div class="translation" id="translation"></div>
          </div>
        </div>
      </div>

      <div class="card-nav" aria-label="카드 이동">
        <button type="button" class="card-nav-btn" id="prevCard" aria-label="이전 카드">‹</button>
        <span class="card-index" id="cardIndex"></span>
        <button type="button" class="card-nav-btn" id="nextCard" aria-label="다음 카드">›</button>
      </div>
    </div>
  </div>

  <script src="19vocabulary_shorts_card_black.js?v=20260417-36"></script>
</body>
</html>
