/* ---------- 관리자 텍스트 → 데이터 변환기 ----------
   - "N. 단어 — 뜻" 줄로 문장이 시작
   - 영어 줄 / 한글 줄 (순서 무관, 한글 포함 여부로 구분)
   - "* 한글 : English" 줄이 끊어 읽기 (적힌 순서 그대로 = 영어 어순)
   - 선택: 맨 위에 "출처 : …", "기사 제목 : …", "원본 링크 : …", "저자 : …", "게시일 : …"
*/
function parseWritingText(text){
  const meta = {}, items = [];
  const META = {'출처':'source','기사 제목':'title','원본 링크':'url','저자':'author','게시일':'date','유튜브':'youtube','YouTube':'youtube','youtube':'youtube'};
  const hasKo = s => /[가-힣]/.test(s);
  const ytIn = s => String(s||'').match(/https?:\/\/(?:www\.)?(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)[\w-]{6,}/);
  function takeMeta(line){
    const labeled = line.match(/^([^:：]+?)\s*[:：]\s*(.+)$/);
    if(labeled && META[labeled[1].trim()]){
      const key = META[labeled[1].trim()];
      meta[key] = labeled[2].trim();
      const yt = ytIn(labeled[2]);
      if(key==='youtube' && yt) meta.youtube = yt[0];
      return true;
    }
    const bare = ytIn(line);
    if(bare && line.trim()===bare[0]){ meta.youtube = bare[0]; return true; }
    return false;
  }
  let cur = null;
  String(text).replace(/\r/g,'').split('\n').forEach(raw=>{
    const line = raw.trim(); if(!line) return;
    let m;
    if(takeMeta(line)) return;
    if((m = line.match(/^(\d+)\.\s*(.+?)\s*[—–-]\s*(.+)$/))){
      cur = { no:+m[1], word:m[2].trim(), meaning:m[3].trim(), en:'', ko:'', chunks:[] }; items.push(cur); return;
    }
    if(!cur) return;
    if((m = line.match(/^[*•\-]\s*(.+?)\s+[:：]\s+(.+)$/))){ cur.chunks.push({ko:m[1].trim(), en:m[2].trim()}); return; }
    if(hasKo(line)){ if(!cur.ko) cur.ko = line; } else { if(!cur.en) cur.en = line; }
  });
  return items.map(it=>({ ...meta, ...it }));
}

(function(){
  const $ = s => document.querySelector(s);
  let sentences = [];

  function loadState(){
    try{ const d = JSON.parse(localStorage.getItem(CONFIG.storageKey)); if(d && d.drafts){ d.comments = d.comments || {}; return d; } }catch(e){}
    return { drafts:{}, works:[], comments:{}, ui:{hideKo:false, showEn:false} };
  }
  function save(quiet){
    try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); if(!quiet) toast('저장했습니다'); }
    catch(e){ toast('이 브라우저에서는 저장할 수 없습니다'); }
  }
  let t; function autosave(){ clearTimeout(t); t=setTimeout(()=>save(true),600); }
  function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),1600); }
  /* 백엔드 행 → 화면 형식 (컬럼명이 다르면 여기만 고치세요) */
  function mapRow(r, i){
    const chunks = Array.isArray(r.chunks) ? r.chunks
      : typeof r.chunks === 'string' ? (()=>{ try{ return JSON.parse(r.chunks); }catch(e){ return []; } })() : [];
    return {
      id:      String((currentArticleId ? currentArticleId + '-' : '') + (r.no ?? r.id ?? r.sentence_id ?? i)),
      word:    r.word ?? r.keyword ?? '',
      wordKo:  r.meaning ?? r.word_ko ?? '',
      en:      r.en ?? r.english ?? r.sentence ?? '',
      ko:      r.ko ?? r.korean ?? r.sentence_ko ?? '',
      chunks:  chunks.map(c=>({ko:c.ko ?? c.korean, en:c.en ?? c.english})).filter(c=>c.ko && c.en),
      title:   r.title ?? '', source: r.source ?? '', url: r.url ?? '',
      youtube: r.youtube ?? '', videoId: r.videoId ?? '',
      byline:  [r.author, r.date ?? r.published_at].filter(Boolean).join(' · ')
    };
  }

  function writingApiUrl(){
    if(CONFIG.apiUrl) return CONFIG.apiUrl;
    if(typeof window.getPage30ApiBaseUrl === 'function'){
      return String(window.getPage30ApiBaseUrl() || '').replace(/\/$/, '') + '/english-writing';
    }
    return '';
  }
  function rowsFromPayload(body){
    let d = null;
    try{ d = JSON.parse(body); }catch(e){ d = null; }
    if(d && typeof d.text === 'string'){
      const topic = String(d.title || '').replace(/^\s*영작\s*[|｜]\s*/, '').trim();
      return parseWritingText(d.text).map(function(row){
        return Object.assign({}, row, {
          title: topic || row.title || '',
          source: d.source || row.source || '',
          url: d.url || row.url || '',
          videoId: d.videoId || row.videoId || '',
          youtube: row.youtube || ''
        });
      });
    }
    if(d){
      const list = Array.isArray(d) ? d : (d.items || d.data || d.sentences || []);
      if(Array.isArray(list) && list.length) return list;
    }
    return parseWritingText(body);
  }
  function applyPageTitle(topic){
    const clean = String(topic || '').replace(/^\s*영작\s*[|｜]\s*/, '').trim();
    const full = clean ? ('영작 | ' + clean) : '영작';
    document.title = full + ' | English Easy Study';
    const h1 = document.getElementById('page-title');
    if(h1) h1.textContent = full;
  }
  function applyPageSource(s){
    const el = document.getElementById('page-source');
    if(!el) return;
    if(!s || (!s.source && !s.url)){ el.hidden = true; el.textContent = ''; return; }
    const name = s.source ? esc(s.source) : '기사';
    el.innerHTML = s.url
      ? '출처: <a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + name + '</a>'
      : '출처: ' + name;
    el.hidden = false;
  }
  function youtubeHref(s){
    const raw = String((s && (s.youtube || s.videoId)) || '').trim();
    if(!raw) return '';
    if(/^https?:\/\//i.test(raw)) return raw;
    return 'https://www.youtube.com/watch?v=' + raw;
  }
  function applyPageLinks(s){
    const el = document.getElementById('page-links');
    if(!el) return;
    const parts = [];
    const yt = youtubeHref(s);
    if(yt) parts.push('<a href="' + esc(yt) + '" target="_blank" rel="noopener">유튜브 바로가기</a>');
    if(s && s.url) parts.push('<a href="' + esc(s.url) + '" target="_blank" rel="noopener">원문 기사 보기</a>');
    el.innerHTML = parts.join('');
    el.hidden = !parts.length;
  }
  function embeddedById(id){
    return EMBEDDED_WRITINGS.find(function(item){ return item.id === id || item.videoId === id; }) || null;
  }
  async function loadCatalog(){
    const remote = [];
    const url = writingApiUrl();
    if(url){
      try{
        const res = await fetch(url, { credentials: 'omit', cache: 'no-store' });
        if(res.ok){
          const data = await res.json();
          if(Array.isArray(data.items)) remote.push.apply(remote, data.items);
          else if(data && data.title && data.text){
            remote.push({ id: data.videoId || 'latest', title: data.title, source: data.source || '', url: data.url || '', videoId: data.videoId || '' });
          }
        }
      }catch(e){ console.error('[영작] 목록 실패:', e); }
    }
    const seen = {};
    remote.forEach(function(item){ seen[item.id || item.videoId] = true; });
    return remote.concat(EMBEDDED_WRITINGS.filter(function(item){ return !seen[item.id]; }));
  }
  async function loadArticle(id){
    const url = writingApiUrl();
    if(url && id){
      try{
        const res = await fetch(url + '?id=' + encodeURIComponent(id), { credentials: 'omit', cache: 'no-store' });
        if(res.ok){
          const data = await res.json();
          const got = data.videoId || data.id || '';
          if(data && typeof data.text === 'string' && data.text.trim() && (!got || got === id)) return data;
        }
      }catch(e){ console.error('[영작] 글 실패:', e); }
    }
    return embeddedById(id);
  }
  function renderCatalog(items){
    applyPageTitle('');
    const lead = document.getElementById('page-lead');
    if(lead) lead.innerHTML = '제목을 누르면 그 기사의 영작을 시작합니다.';
    applyPageSource(null);
    applyPageLinks(null);
    const box = document.getElementById('catalog');
    const list = document.getElementById('list');
    if(list) list.innerHTML = '';
    if(!box) return;
    box.hidden = false;
    if(!items.length){
      box.innerHTML = '<p class="lead">아직 올라온 영작이 없습니다.</p>';
      return;
    }
    box.innerHTML = items.map(function(item){
      const id = item.id || item.videoId;
      return '<a href="english-writing.html?id=' + encodeURIComponent(id) + '">' +
        '<span class="src">' + esc(item.source || '영작') + '</span>' +
        '<span class="ttl">' + esc(item.title || '제목 없음') + '</span></a>';
    }).join('');
  }

  const draftOf = s => state.drafts[s.id] || (state.drafts[s.id] = { chunks:[], full:'' });

  /* ---------- 화면 ---------- */
  function render(){
    renderPractice();
    mountCardComments();
  }

  function articleHead(m){
    const a=document.createElement('div'); a.className='article';
    a.innerHTML = `<h2>${esc(/^영작\s*[|｜]/.test(m.title) ? m.title : ('영작 | ' + m.title))}</h2><div class="meta">${m.source?'출처: '+esc(m.source):''}${m.byline?' · '+esc(m.byline):''}${m.url?` · <a href="${esc(m.url)}" target="_blank" rel="noopener">원문 보기</a>`:''}</div>`;
    return a;
  }

  function renderPractice(){
    const list=$('#list'); list.innerHTML='';
    if(!sentences.length){ list.innerHTML='<p class="lead">불러온 문장이 없습니다.</p>'; applyPageSource(null); applyPageLinks(null); return; }
    applyPageSource(sentences[0]);
    applyPageLinks(sentences[0]);
    const pageTopic = String(sentences[0].title || '').replace(/^\s*영작\s*[|｜]\s*/, '').trim();
    let last = pageTopic;
    sentences.forEach((s,i)=>{
      const topic = String(s.title || '').replace(/^\s*영작\s*[|｜]\s*/, '').trim();
      if(topic && topic !== last){ list.appendChild(articleHead(s)); last = topic; }
      list.appendChild(cardEl(s, i+1));
    });
  }

  const LEMMA = {
    am:'be', is:'be', are:'be', was:'be', were:'be', been:'be', being:'be',
    has:'have', had:'have', having:'have',
    does:'do', did:'do', done:'do', doing:'do',
    goes:'go', went:'go', gone:'go', going:'go',
    made:'make', making:'make', makes:'make',
    said:'say', says:'say', saying:'say',
    got:'get', gotten:'get', getting:'get', gets:'get',
    took:'take', taken:'take', taking:'take', takes:'take',
    came:'come', coming:'come', comes:'come',
    saw:'see', seen:'see', seeing:'see', sees:'see',
    knew:'know', known:'know', knowing:'know', knows:'know',
    thought:'think', thinking:'think', thinks:'think',
    gave:'give', given:'give', giving:'give', gives:'give',
    found:'find', finding:'find', finds:'find',
    told:'tell', telling:'tell', tells:'tell',
    became:'become', becoming:'become', becomes:'become',
    left:'leave', leaving:'leave', leaves:'leave',
    felt:'feel', feeling:'feel', feels:'feel',
    meant:'mean', meaning:'mean', means:'mean',
    kept:'keep', keeping:'keep', keeps:'keep',
    began:'begin', begun:'begin', beginning:'begin', begins:'begin',
    shown:'show', showed:'show', showing:'show', shows:'show',
    heard:'hear', hearing:'hear', hears:'hear',
    ran:'run', running:'run', runs:'run',
    wrote:'write', written:'write', writing:'write', writes:'write',
    sat:'sit', sitting:'sit', sits:'sit',
    stood:'stand', standing:'stand', stands:'stand',
    lost:'lose', losing:'lose', loses:'lose',
    paid:'pay', paying:'pay', pays:'pay',
    met:'meet', meeting:'meet', meets:'meet',
    led:'lead', leading:'lead', leads:'lead',
    understood:'understand', understanding:'understand', understands:'understand',
    spoke:'speak', spoken:'speak', speaking:'speak', speaks:'speak',
    spent:'spend', spending:'spend', spends:'spend',
    grew:'grow', grown:'grow', growing:'grow', grows:'grow',
    taught:'teach', teaching:'teach', teaches:'teach',
    bought:'buy', buying:'buy', buys:'buy',
    sent:'send', sending:'send', sends:'send',
    built:'build', building:'build', builds:'build',
    fell:'fall', fallen:'fall', falling:'fall', falls:'fall',
    brought:'bring', bringing:'bring', brings:'bring',
    won:'win', winning:'win', wins:'win',
    held:'hold', holding:'hold', holds:'hold',
    rose:'rise', risen:'rise', rising:'rise', rises:'rise',
    drove:'drive', driven:'drive', driving:'drive', drives:'drive',
    broke:'break', broken:'break', breaking:'break', breaks:'break',
    chose:'choose', chosen:'choose', choosing:'choose', chooses:'choose',
    wore:'wear', worn:'wear', wearing:'wear', wears:'wear',
    forgot:'forget', forgotten:'forget', forgetting:'forget', forgets:'forget',
    hid:'hide', hidden:'hide', hiding:'hide', hides:'hide',
    caught:'catch', catching:'catch', catches:'catch',
    fought:'fight', fighting:'fight', fights:'fight',
    sought:'seek', seeking:'seek', seeks:'seek',
    sold:'sell', selling:'sell', sells:'sell',
    slept:'sleep', sleeping:'sleep', sleeps:'sleep',
    dealt:'deal', dealing:'deal', deals:'deal',
    lent:'lend', lending:'lend', lends:'lend',
    proved:'prove', proving:'prove', proves:'prove', proven:'prove',
    cut:'cut', cutting:'cut', cuts:'cut',
    put:'put', putting:'put', puts:'put',
    let:'let', letting:'let', lets:'let',
    set:'set', setting:'set', sets:'set',
    hit:'hit', hitting:'hit', hits:'hit',
    hurt:'hurt', hurting:'hurt', hurts:'hurt',
    cost:'cost', costing:'cost', costs:'cost',
    living:'living', during:'during', morning:'morning', evening:'evening',
    something:'something', nothing:'nothing', everything:'everything'
  };
  function lemmaWord(raw){
    let w = String(raw || '').toLowerCase().replace(/^[^a-z']+|[^a-z']+$/g, '');
    if(!w) return '';
    if(LEMMA[w]) return LEMMA[w];
    if(w.length < 4 || /^(this|thus|yes|its|his|plus|bus|news)$/.test(w)) return w;
    if(/[^aeiou]ies$/.test(w)) return w.slice(0, -3) + 'y';
    if(w.endsWith('ied')) return w.slice(0, -3) + 'y';
    if(w.endsWith('ing') || w.endsWith('ed')){
      const cut = w.endsWith('ing') ? 3 : 2;
      let stem = w.slice(0, -cut);
      if(/([bcdfghjklmnpqrstvwxz])\1$/.test(stem)) return stem.slice(0, -1);
      if(/[aeiou]y$/.test(stem) || /e$/.test(stem) || /(?:ch|sh|th|gh|ck|ng)$/.test(stem)) return stem;
      if(/[aeiou][bcdfghjklmnpqrstvwxz]$/.test(stem) && (stem.match(/[aeiou]+/g)||[]).length===1) return stem + 'e';
      return stem;
    }
    if(/(?:ches|shes|sses|xes|zes|oes)$/.test(w)) return w.slice(0, -2);
    if(w.endsWith('s') && !w.endsWith('ss') && !/(?:us|is|as|os)$/.test(w)) return w.slice(0, -1);
    return w;
  }
  function shuffleWords(list){
    const a = list.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function lemmaHint(text){
    const tokens = String(text || '').match(/[A-Za-z]+(?:'[A-Za-z]+)?/g) || [];
    return shuffleWords(tokens.map(lemmaWord).filter(Boolean));
  }
  function cardEl(s, n){
    const d = draftOf(s);
    const hint = lemmaHint(s.en || s.chunks.map(ch=>ch.en).join(' '));
    const c=document.createElement('div'); c.className='card'; c.dataset.id=s.id;
    const rows = s.chunks.map((ch,i)=>`<tr>
        <td class="ko"><span class="ko-text">${esc(ch.ko)}</span></td>
        <td class="inp"><span class="field"><input type="text" data-i="${i}" data-answer="${esc(ch.en)}" value="${esc(d.chunks[i]||'')}" placeholder="영어로 쓰기" autocomplete="off" spellcheck="false"><span class="field-mark" aria-hidden="true"></span></span></td>
        <td class="ans"><span>${esc(ch.en)}</span></td></tr>`).join('');
    c.innerHTML = `
      <div class="card-head">
        <span class="num">${n}.</span>
        <p class="ex-line"><span class="ex-label">예문 :</span> <span class="ko-text">${esc(s.ko)}</span></p>
        <div class="card-tools"><button data-act="reveal">원문 보기</button><button data-act="reset">지우기</button></div>
      </div>
      ${hint.length ? `<div class="word-hint" aria-label="힌트">${hint.map(w=>`<span class="hint-word">${esc(w)}</span>`).join('')}</div>` : ''}
      ${s.chunks.length?`<div class="order-note">↓ 영어 어순</div><table class="chunks"><tbody>${rows}</tbody></table>`:''}
      <div class="full">
        <label>전체 문장 영작</label>
        <span class="field"><input type="text" class="full-inp" data-answer="${esc(s.en)}" value="${esc(d.full||'')}" placeholder="위 구간을 이어서 전체 문장을 써 보세요" autocomplete="off" spellcheck="false"><span class="field-mark" aria-hidden="true"></span></span>
        <div class="en-full"><span class="tag">원문</span>${esc(s.en)}</div>
      </div>
      <div class="card-foot">
        <div class="left" data-ew-comments data-key="ew-${esc(s.id)}" data-word="${esc(s.word)}" data-title="${esc(s.word)}"></div>
        <button data-act="save">저장</button>
        <button data-act="download">다운로드</button>
      </div>`;
    return c;
  }

  function mountCardComments(){
    if(!window.BoardComments || typeof window.BoardComments.mount !== 'function') return;
    document.querySelectorAll('[data-ew-comments]').forEach(function(host){
      window.BoardComments.mount({
        board: 'english-writing',
        contentKey: host.getAttribute('data-key') || '',
        title: host.getAttribute('data-title') || '',
        word: host.getAttribute('data-word') || '',
        root: host
      });
    });
  }
  function trackWords(kind, words){
    if(!window.SiteStats) return;
    const list = (words || []).map(function(w){ return String(w || '').trim(); }).filter(Boolean);
    if(!list.length) return;
    if(kind === 'view' && typeof window.SiteStats.trackView === 'function') window.SiteStats.trackView(list, 'english-writing');
    if(kind === 'download' && typeof window.SiteStats.trackDownload === 'function') window.SiteStats.trackDownload(list, 'english-writing');
  }
  function sentenceText(s){
    const d = draftOf(s);
    let out = `${s.word?s.word+' — '+s.wordKo:''}\n${s.ko}\n\n`;
    s.chunks.forEach((c,i)=>{ out += `* ${c.ko} : ${(d.chunks[i]||'').trim()||'-'}   (원문: ${c.en})\n`; });
    out += `\n[내 영작] ${(d.full||'').trim()||'-'}\n[원문]    ${s.en}\n`;
    return out;
  }
  function normToken(w){
    return String(w||'').toLowerCase().replace(/^[^a-z0-9']+|[^a-z0-9']+$/g,'');
  }
  function diffSegments(mine, answer){
    const mineWords=String(mine).match(/\S+/g)||[];
    const words=mineWords.map(normToken);
    const ans=String(answer).split(/\s+/).map(normToken).filter(Boolean);
    const n=words.length, m=ans.length;
    const dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
    for(let i=n-1;i>=0;i--){
      for(let j=m-1;j>=0;j--){
        dp[i][j]=words[i] && words[i]===ans[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
      }
    }
    const segs=[];
    let i=0, j=0;
    while(i<n || j<m){
      if(i<n && j<m && words[i] && words[i]===ans[j]){ segs.push({text:mineWords[i], cls:'ok'}); i++; j++; }
      else if(i<n && j<m && dp[i+1][j+1] >= dp[i+1][j] && dp[i+1][j+1] >= dp[i][j+1]){ segs.push({text:mineWords[i], cls:'bad'}); i++; j++; }
      else if(i<n && j<m && dp[i+1][j] >= dp[i][j+1]){ segs.push({text:mineWords[i], cls:'bad'}); i++; }
      else if(j<m){ segs.push({text:'xx', cls:'bad'}); j++; }
      else { segs.push({text:mineWords[i], cls:'bad'}); i++; }
    }
    return segs;
  }
  function paintMark(input){
    const mark=input.parentElement && input.parentElement.querySelector('.field-mark');
    const field=input.parentElement;
    if(!mark) return;
    const card=input.closest('.card');
    const mine=input.value;
    if(!card || !card.classList.contains('reveal')){
      mark.innerHTML='';
      if(field) field.style.paddingBottom='';
      return;
    }
    const segs=diffSegments(mine, input.getAttribute('data-answer')||'');
    mark.innerHTML=segs.map(s=>`<span class="${s.cls}">${esc(s.text)}</span>`).join(' ');
    if(field){
      const extra=mark.scrollHeight-input.offsetHeight;
      field.style.paddingBottom=extra>2 ? (extra+'px') : '';
    }
  }
  function paintCard(card){
    if(!card) return;
    card.querySelectorAll('input[data-answer]').forEach(paintMark);
  }
  function downloadText(name, text){
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));
    a.download=name; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  }

  /* ---------- 이벤트 ---------- */
  const findS = id => sentences.find(x=>x.id===String(id));

  $('#list').addEventListener('click', e=>{
    const b=e.target.closest('button[data-act]'); if(!b) return;
    const card=b.closest('.card'), s=findS(card.dataset.id);
    if(b.dataset.act==='save') save(false);
    if(b.dataset.act==='download'){
      const day=new Date().toISOString().slice(0,10);
      trackWords('download', [s.word]);
      downloadText(`writing-${(s.word||'sentence').replace(/\s+/g,'-')}-${day}.txt`,
        `영작 — englisheasystudy.com (${day})\n\n` + sentenceText(s) +
        '\nAll sentences are sourced from global news outlets for English practice. All rights belong to the original creators.\n');
    }
    if(b.dataset.act==='reveal'){ card.classList.toggle('reveal'); b.textContent=card.classList.contains('reveal')?'원문 숨기기':'원문 보기'; paintCard(card); }
    if(b.dataset.act==='reset'){ if(!confirm('이 문장의 작성 내용을 지울까요?')) return;
      delete state.drafts[s.id]; autosave(); card.replaceWith(cardEl(s, sentences.indexOf(s)+1)); mountCardComments(); }
  });
  $('#list').addEventListener('input', e=>{
    const card=e.target.closest('.card'); if(!card) return;
    const d=draftOf(findS(card.dataset.id));
    if(e.target.matches('td.inp input')) d.chunks[+e.target.dataset.i]=e.target.value;
    if(e.target.matches('.full-inp')) d.full=e.target.value;
    if(e.target.matches('input[data-answer]')) paintMark(e.target);
    autosave();
  });
  $('#list').addEventListener('keydown', e=>{
    if(e.key!=='Enter' || !e.target.matches('input')) return;
    const ins=[...e.target.closest('.card').querySelectorAll('input[type=text]')];
    const nx=ins[ins.indexOf(e.target)+1]; if(nx) nx.focus();
  });

  (async ()=>{
    const articleId = new URLSearchParams(location.search).get('id');
    if(!articleId){
      renderCatalog(await loadCatalog());
      return;
    }
    currentArticleId = articleId;
    const back = document.getElementById('back-row');
    if(back) back.hidden = false;
    const lead = document.getElementById('page-lead');
    if(lead) lead.innerHTML = '한글 구간이 <b>영어 어순</b>으로 나열되어 있습니다. 각 구간을 영어로 쓰고, 이어서 전체 문장을 완성한 뒤 원문과 비교해 보세요.';
    $('#list').innerHTML='<p class="lead">문장을 불러오는 중…</p>';
    const article = await loadArticle(articleId);
    const rows = article ? rowsFromPayload(JSON.stringify(article)) : [];
    sentences=rows.map(mapRow).filter(s=>s.ko && s.en);
    applyPageTitle((article && article.title) || (sentences[0] && sentences[0].title) || '');
    trackWords('view', sentences.map(function(s){ return s.word; }));
    render();
  })();
})();
