<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시사 영단어 · 손글씨 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Noto+Sans+KR:wght@400;500;700;800&family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous">
<link rel="stylesheet" href="19vocabulary_shorts_001layout2_cfLFthumb_associateLFshortKOkoaupgrades63voca_without_cfv0.2.css?v=20261018sumswap">
</head>
<body>
<div class="viewport">
  <main class="stage paper hide-meaning" id="stage">
    <div class="margin-line"></div>
    <section class="content">
      <!-- quiz / summary 중에도 고정 -->
      <div class="content-head" id="content-head">
        <div class="head-row">
          <span class="badge" id="badge">시사 영단어</span>
          <span class="date" id="dateLabel">Vocab Note</span>
        </div>

        <div class="title-row">
          <h1 class="title" id="title"></h1>
          <figure class="title-photo" id="title-photo" hidden>
            <img id="title-photo-img" alt="" />
          </figure>
        </div>

        <div class="source-row">
          <span id="sourceLabel"></span>
          <span class="circled" id="sourceMark"></span>
          <svg width="70" height="40" viewBox="0 0 70 40" aria-hidden="true"><path d="M4 22 C 20 12, 40 30, 62 18 M50 8 L64 18 L52 30" fill="none" stroke="#c23b3b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>

      <ol class="words" id="words"></ol>
    </section>

    <div class="outro" id="outro"></div>

    <div id="summary-root" class="summary-root" hidden>
      <div class="summary-list" id="summary-list"></div>
      <div class="summary-countdown" id="summary-countdown" hidden>
        <span class="summary-countdown-num" id="summary-countdown-num">10</span>
      </div>
    </div>

    <div id="review-root" class="review-root" hidden>
      <div class="rv-panel">
        <div class="rv-countdown-slot">
          <div class="countdown-wrap" id="countdown-wrap" hidden>
            <div class="countdown-stage" data-mode="ring">
              <svg class="countdown-ring" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="countdown-ring-track" cx="60" cy="60" r="52"></circle>
                <circle class="countdown-ring-progress" id="countdown-ring-progress" cx="60" cy="60" r="52"
                  pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
              </svg>
              <span class="countdown-num" id="countdown-num" aria-hidden="true">3</span>
            </div>
          </div>
        </div>
        <div id="rv-title" class="rv-title"></div>
        <div id="rv-en" class="rv-en"></div>
        <div id="rv-ko" class="rv-ko"></div>
      </div>
    </div>
  </main>
</div>

<button class="autoplay-btn" id="autoplay" type="button">auto play</button>

<script src="19vocabulary_shorts_001layout2_cfLFthumb_associateLFshortKOkoaupgrades63voca_without_cfv0.2.js?v=20261018sumkokofirst"></script>
</body>
</html>
