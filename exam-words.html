const FALLBACK = {};
for (const k in DATA) {
  FALLBACK[k] = DATA[k].split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf('|');
    return { id: k + ':' + l.slice(0, i).trim(), word: l.slice(0, i).trim(), meaning: l.slice(i + 1).trim() };
  });
}
FALLBACK.all = [].concat(FALLBACK.elem || [], FALLBACK.middle || [], FALLBACK.high || []);

const list = document.getElementById('list');
const statusEl = document.getElementById('status');
const pager = document.getElementById('pager');
const nav = document.querySelector('.tabs');
const sO = document.getElementById('sO');
const sX = document.getElementById('sX');
const sPts = document.getElementById('sPts');
const btnSeq = document.getElementById('orderSeq');
const btnRand = document.getElementById('orderRand');
const btnSave = document.getElementById('exam-save');
const btnDownload = document.getElementById('exam-download');
const savedCountEl = document.getElementById('exam-saved-count');
const commentsRoot = document.getElementById('exam-comments');

const BOARD = 'exam-words';
const SAVE_KEY = 'exam-words-saved-v1';

let cats = [];
let level = 'elem';
let order = 'random';   // seq | random
let page = 1;
let pages = 1;
let pool = [];
/** 같은 세트에서 오답 재사용을 줄이기 위한 추적 */
let usedDistractors = new Set();
let ok = 0;
let no = 0;
let gen = 0;
let useApi = true;
let loading = false;
let commentsGen = 0;

function setStatus(msg) {
  if (!msg) {
    statusEl.hidden = true;
    statusEl.textContent = '';
    return;
  }
  statusEl.hidden = false;
  statusEl.textContent = msg;
}

function loadSavedMap() {
  try {
    return JSON.parse(sessionStorage.getItem(SAVE_KEY) || '{}') || {};
  } catch (e) {
    return {};
  }
}
function persistSavedMap(map) {
  try {
    sessionStorage.setItem(SAVE_KEY, JSON.stringify(map));
  } catch (e) { /* ignore */ }
}
function savedEntries() {
  const map = loadSavedMap();
  return Object.keys(map).map(function (k) { return map[k]; }).filter(Boolean);
}
function syncSaveUi() {
  const map = loadSavedMap();
  const n = Object.keys(map).length;
  const allOn = pool.length > 0 && pool.every(function (w) { return !!map[w.id]; });
  btnSave.setAttribute('aria-pressed', allOn ? 'true' : 'false');
  btnSave.textContent = allOn ? '저장됨' : '저장';
  savedCountEl.textContent = String(n);
  if (n > 0) {
    btnDownload.hidden = false;
    btnDownload.disabled = false;
  } else {
    btnDownload.hidden = true;
    btnDownload.disabled = true;
  }
}
function contentKeyForSet() {
  return 'exam-' + level + '-' + order + '-p' + page;
}
function placeToolsInCommentBar() {
  const bar = commentsRoot.querySelector('.os-cmt-bar');
  if (!bar) return;
  if (btnSave.parentElement !== bar) bar.appendChild(btnSave);
  if (btnDownload.parentElement !== bar) bar.appendChild(btnDownload);
}

async function mountSetComments() {
  const my = ++commentsGen;
  const stash = document.getElementById('exam-tool-stash');
  if (stash) {
    if (btnSave.parentElement !== stash) stash.appendChild(btnSave);
    if (btnDownload.parentElement !== stash) stash.appendChild(btnDownload);
  }
  commentsRoot.textContent = '';
  commentsRoot.removeAttribute('data-mounted');
  if (!window.BoardComments || typeof window.BoardComments.mount !== 'function') {
    if (stash) {
      stash.hidden = false;
      stash.style.display = 'flex';
      stash.style.justifyContent = 'center';
      stash.style.gap = '14px';
    }
    return;
  }
  try {
    await window.BoardComments.mount({
      board: BOARD,
      contentKey: contentKeyForSet(),
      title: '수험영어 ' + level + ' p' + page,
      root: commentsRoot
    });
    if (my !== commentsGen) return;
    placeToolsInCommentBar();
    if (stash) stash.hidden = true;
  } catch (e) {
    console.warn('[수험영어] 댓글 마운트 실패', e);
    if (stash) {
      stash.hidden = false;
      stash.style.display = 'flex';
      stash.style.justifyContent = 'center';
      stash.style.gap = '14px';
    }
  }
}
function downloadSaved() {
  const rows = savedEntries();
  if (!rows.length) return;
  const text = rows.map(function (w) {
    return (w.en || w.word || '') + '\t' + (w.ko || w.meaning || '');
  }).join('\n');
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  const day = new Date().toISOString().slice(0, 10);
  a.href = URL.createObjectURL(blob);
  a.download = 'exam-words-' + day + '.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  if (window.SiteStats && typeof window.SiteStats.trackDownload === 'function') {
    try {
      window.SiteStats.trackDownload(
        rows.map(function (w) { return w.en || w.word; }).filter(Boolean),
        BOARD
      );
    } catch (e) { /* ignore */ }
  }
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shortName(name) {
  return String(name || '').replace(/영어\s*$/u, '').trim() || name;
}
async function getJSON(url) {
  const r = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '').trim();
  if (!raw) return { cat: '', page: 1 };
  const parts = raw.split(/[/?&]/);
  const cat = parts[0] || '';
  let p = 1;
  const m = raw.match(/(?:^|[/?&])p(?:age)?=(\d+)/i) || raw.match(/\/(\d+)$/);
  if (m) p = Math.max(1, parseInt(m[1], 10) || 1);
  return { cat, page: p };
}
function setHash(cat, p) {
  const h = '#' + cat + (p > 1 ? '/p=' + p : '');
  if (location.hash !== h) history.replaceState(null, '', h);
}
function updateScore() {
  sO.textContent = ok;
  sX.textContent = no;
  sPts.textContent = ok * POINT_EACH;
}
function syncOrderButtons() {
  btnSeq.setAttribute('aria-pressed', order === 'seq' ? 'true' : 'false');
  btnRand.setAttribute('aria-pressed', order === 'random' ? 'true' : 'false');
}

async function loadCategories() {
  try {
    const d = await getJSON(API_BASE + '/categories');
    cats = (Array.isArray(d) ? d : d.categories || [])
      .filter(c => c && c.slug && c.name)
      .map(c => ({ slug: c.slug, name: shortName(c.name) }));
    if (!cats.length) throw new Error('empty');
  } catch (e) {
    console.warn('[수험영어] 분류 API 실패, 예비 사용:', e.message);
    useApi = false;
    cats = FALLBACK_CATS.slice();
  }
  if (!cats.some(c => c.slug === 'all')) cats.push({ slug: 'all', name: '랜덤' });
  nav.innerHTML = '';
  for (const c of cats) {
    const a = document.createElement('a');
    a.href = '#' + c.slug;
    a.dataset.level = c.slug;
    a.textContent = c.name;
    nav.appendChild(a);
  }
  nav.style.overflowX = 'auto';
}

function fallbackPage(cat, p, ord) {
  let src = (FALLBACK[cat] || []).slice();
  if (ord === 'seq') {
    src.sort((a, b) => a.word.localeCompare(b.word) || a.id.localeCompare(b.id));
  } else {
    src = shuffle(src);
  }
  const total = src.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const safe = Math.min(Math.max(1, p), totalPages);
  const slice = ord === 'seq'
    ? src.slice((safe - 1) * PAGE_SIZE, safe * PAGE_SIZE)
    : src.slice(0, PAGE_SIZE);
  return { words: slice, total, page: safe, pages: totalPages };
}

async function fetchSet(cat, p) {
  if (useApi) {
    try {
      const q = new URLSearchParams({
        cat,
        limit: String(PAGE_SIZE),
        page: String(p),
        order,
        mode: 'en2ko'
      });
      const d = await getJSON(API_BASE + '/words?' + q.toString());
      const words = Array.isArray(d) ? d : d.words;
      return {
        words: words || [],
        total: d.total || (words || []).length,
        page: d.page || p,
        pages: d.pages || 1
      };
    } catch (e) {
      console.warn('[수험영어] 단어 API 실패:', e.message);
    }
  }
  return fallbackPage(cat, p, order);
}

function normKo(s) {
  return String(s || '').replace(/\s+/g, '').toLowerCase();
}

/** 현재 분류(초등/중등/고등/랜덤) 전체 뜻 풀 — 페이지 10개만 쓰면 오답이 일률적으로 반복됨 */
function meaningBank() {
  const key = level === 'all' ? 'all' : level;
  const rows = FALLBACK[key] || FALLBACK.all || [];
  return rows.map(function (w) {
    return { ko: w.meaning, en: w.word };
  }).concat(pool.map(function (w) {
    return { ko: w.ko, en: w.en };
  }));
}

/**
 * 오답 3개: 같은 분류 전체에서 뽑고, 길이 비슷한 뜻을 우선.
 * 이번 세트에서 이미 쓴 오답은 뒤로 미뤄 반복을 줄임.
 */
function choices(answer) {
  const answerKo = String(answer.ko || '').trim();
  const seen = new Set([normKo(answerKo)]);
  const picked = [];
  const targetLen = answerKo.length || 4;
  const similarLimit = Math.max(2, Math.round(targetLen * 0.6));

  const scored = [];
  const bankSeen = new Set();
  meaningBank().forEach(function (w) {
    const ko = String(w.ko || '').trim();
    const key = normKo(ko);
    if (!ko || !key || seen.has(key) || bankSeen.has(key)) return;
    bankSeen.add(key);
    scored.push({
      ko: ko,
      lenDiff: Math.abs(ko.length - targetLen),
      used: usedDistractors.has(key)
    });
  });

  const freshSimilar = shuffle(scored.filter(function (w) { return !w.used && w.lenDiff <= similarLimit; }));
  const freshRest = shuffle(scored.filter(function (w) { return !w.used && w.lenDiff > similarLimit; }));
  const reused = shuffle(scored.filter(function (w) { return w.used; }));
  const ordered = freshSimilar.concat(freshRest, reused);

  for (let i = 0; i < ordered.length; i++) {
    const ko = ordered[i].ko;
    const key = normKo(ko);
    if (seen.has(key)) continue;
    seen.add(key);
    usedDistractors.add(key);
    picked.push(ko);
    if (picked.length === 3) break;
  }
  return shuffle([answerKo].concat(picked));
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

function makeCard(w, num) {
  const opts = choices(w);
  const card = document.createElement('article');
  card.className = 'q';
  card.innerHTML =
    '<div class="q-head"><span class="num">' + num + '</span>' +
    '<span class="word"></span>' +
    '<button type="button" class="say" aria-label="발음 듣기"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button></div>' +
    '<ol class="opts"></ol>';
  card.querySelector('.word').textContent = w.en;
  card.querySelector('.say').onclick = () => speak(w.en);
  const ol = card.querySelector('.opts');
  const btns = opts.map((ko, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    b.innerHTML = '<span class="n">' + (i + 1) + '.</span><span class="t"></span><span class="ox" aria-hidden="true"></span>';
    b.querySelector('.t').textContent = ko;
    b.dataset.right = ko === w.ko ? '1' : '';
    b.onclick = () => answer(card, btns, b, ko === w.ko, w);
    li.appendChild(b);
    ol.appendChild(li);
    return b;
  });
  list.appendChild(card);
}

function answer(card, btns, chosen, right, w) {
  if (card.classList.contains('done')) return;
  card.classList.add('done');
  btns.forEach(b => { b.disabled = true; });
  const correctBtn = btns.find(b => b.dataset.right);
  correctBtn.classList.add('correct');
  correctBtn.querySelector('.ox').textContent = 'O';
  if (!right) {
    chosen.classList.add('wrong');
    chosen.querySelector('.ox').textContent = 'X';
  }
  const m = document.createElement('span');
  m.className = 'mark ' + (right ? 'o' : 'x');
  m.textContent = right ? 'O' : 'X';
  m.setAttribute('aria-label', right ? '정답' : '오답, 정답은 ' + w.ko);
  card.appendChild(m);
  right ? ok++ : no++;
  updateScore();
}

function pageWindow(cur, total) {
  if (total <= 9) {
    const a = [];
    for (let i = 1; i <= total; i++) a.push(i);
    return a;
  }
  const set = new Set([1, total, cur, cur - 1, cur + 1, cur - 2, cur + 2]);
  const nums = [...set].filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
  const out = [];
  for (let i = 0; i < nums.length; i++) {
    if (i && nums[i] - nums[i - 1] > 1) out.push('…');
    out.push(nums[i]);
  }
  return out;
}

function renderPager() {
  pager.innerHTML = '';
  if (pages < 1) return;
  const prev = document.createElement('button');
  prev.type = 'button';
  prev.textContent = '이전';
  prev.disabled = page <= 1;
  prev.onclick = () => goPage(page - 1);
  pager.appendChild(prev);

  for (const item of pageWindow(page, pages)) {
    if (item === '…') {
      const span = document.createElement('span');
      span.className = 'ellipsis';
      span.textContent = '…';
      pager.appendChild(span);
      continue;
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(item);
    if (item === page) b.setAttribute('aria-current', 'page');
    b.onclick = () => goPage(item);
    pager.appendChild(b);
  }

  const next = document.createElement('button');
  next.type = 'button';
  next.textContent = '다음';
  next.disabled = page >= pages;
  next.onclick = () => goPage(page + 1);
  pager.appendChild(next);
}

function goPage(p) {
  const safe = Math.min(Math.max(1, p), pages || 1);
  setHash(level, safe);
  loadSet(level, safe);
}

async function loadSet(cat, p) {
  const my = ++gen;
  level = cats.some(c => c.slug === cat) ? cat : (cats[0] && cats[0].slug) || 'elem';
  page = Math.max(1, p || 1);
  ok = 0;
  no = 0;
  updateScore();
  list.innerHTML = '';
  setStatus('');
  pager.innerHTML = '';
  nav.querySelectorAll('a').forEach(a => {
    if (a.dataset.level === level) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  setHash(level, page);
  syncOrderButtons();
  window.scrollTo(0, 0);

  loading = true;
  try {
    const data = await fetchSet(level, page);
    if (my !== gen) return;
    page = data.page || page;
    pages = data.pages || 1;
    const words = (data.words || [])
      .filter(w => w && w.word && w.meaning)
      .map(w => ({ id: String(w.id ?? (w.word + '|' + w.meaning)), en: w.word, ko: w.meaning }));
    pool = words.slice();
    usedDistractors = new Set();
    if (!words.length) {
      setStatus('이 분류에는 아직 단어가 없어요');
      syncSaveUi();
      return;
    }
    words.forEach((w, i) => makeCard(w, i + 1));
    renderPager();
    syncSaveUi();
    mountSetComments();
  } finally {
    loading = false;
  }
}

function onHash() {
  const { cat, page: p } = parseHash();
  loadSet(cat, p);
}

btnSeq.onclick = () => {
  order = 'seq';
  syncOrderButtons();
  loadSet(level, 1);
};
btnRand.onclick = () => {
  order = 'random';
  syncOrderButtons();
  loadSet(level, 1);
};
document.getElementById('reset').onclick = () => loadSet(level, page);
btnSave.onclick = () => {
  const map = loadSavedMap();
  const allOn = pool.length > 0 && pool.every(function (w) { return !!map[w.id]; });
  if (allOn) {
    pool.forEach(function (w) { delete map[w.id]; });
  } else {
    pool.forEach(function (w) {
      map[w.id] = { id: w.id, en: w.en, ko: w.ko };
    });
  }
  persistSavedMap(map);
  syncSaveUi();
};
btnDownload.onclick = () => downloadSaved();
window.addEventListener('hashchange', onHash);
syncSaveUi();

loadCategories().then(() => {
  const { cat, page: p } = parseHash();
  const startCat = cats.some(c => c.slug === cat) ? cat : cats[0].slug;
  loadSet(startCat, cat ? p : 1);
});
</script>
