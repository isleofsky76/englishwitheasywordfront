/* ===== 설정 ===== */
const API_BASE = (typeof window.getPage30ApiBaseUrl === 'function'
  ? window.getPage30ApiBaseUrl()
  : 'https://port-0-englishwitheasyword-backend-1272llwoib16o.sel5.cloudtype.app') + '/api/exam';
const FETCH_SIZE = 40;            // 한 번에 DB에서 가져올 랜덤 단어 수
const BATCH      = 10;            // 스크롤마다 붙는 문제 수
const FALLBACK_CATS = [
  { slug: 'elem', name: '초등영어' }, { slug: 'middle', name: '중등영어' }, { slug: 'high', name: '고등영어' }
];

const FALLBACK = {};
for (const k in DATA) {
  FALLBACK[k] = DATA[k].split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const i = l.indexOf('|'); return { id: k + ':' + l.slice(0, i).trim(), word: l.slice(0, i).trim(), meaning: l.slice(i + 1).trim() };
  });
}

const list = document.getElementById('list'), more = document.getElementById('more'), nav = document.querySelector('.tabs');
const sO = document.getElementById('sO'), sX = document.getElementById('sX'), sR = document.getElementById('sR');
let cats = [], level, pool, queue, recent, qn, ok, no, gen = 0, useApi = true, loading = null, adding = false;

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
async function getJSON(url) {
  const r = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* 분류 목록: DB의 exam_categories → 탭 */
async function loadCategories() {
  try {
    const d = await getJSON(API_BASE + '/categories');
    cats = (Array.isArray(d) ? d : d.categories || []).filter(c => c && c.slug && c.name);
    if (!cats.length) throw new Error('empty');
  } catch (e) {
    console.warn('[수험영어] 분류 API 연결 실패, 예비 단어 사용:', e.message);
    useApi = false; cats = FALLBACK_CATS;
  }
  nav.innerHTML = '';
  for (const c of cats) {
    const a = document.createElement('a');
    a.href = '#' + c.slug; a.dataset.level = c.slug; a.textContent = c.name;
    nav.appendChild(a);
  }
  nav.style.overflowX = 'auto';
}

/* 랜덤 단어 가져오기: DB → 실패하면 예비 단어 */
function fetchWords() {
  if (loading) return loading;
  const my = gen;
  loading = (async () => {
    let words = null;
    if (useApi) {
      try {
        const d = await getJSON(API_BASE + '/words?cat=' + encodeURIComponent(level) + '&limit=' + FETCH_SIZE);
        words = Array.isArray(d) ? d : d.words;
      } catch (e) { console.warn('[수험영어] 단어 API 실패:', e.message); }
    }
    if (!words) words = shuffle((FALLBACK[level] || []).slice()).slice(0, FETCH_SIZE);
    if (my !== gen) return;
    const fresh = words.filter(w => w && w.word && w.meaning)
      .map(w => ({ id: String(w.id ?? (w.word + '|' + w.meaning)), en: w.word, ko: w.meaning }));
    const before = queue.length;
    for (const w of fresh) {
      if (!pool.some(p => p.id === w.id)) pool.push(w);
      if (!recent.includes(w.id) && !queue.some(q => q.id === w.id)) queue.push(w);
    }
    if (queue.length === before) queue.push(...fresh);   // 단어가 적은 분류: 최근 것도 다시 출제
  })().finally(() => { loading = null; });
  return loading;
}

function nextWord() {
  const w = queue.shift();
  recent.push(w.id);
  const keep = Math.min(30, Math.floor(pool.length / 2));
  while (recent.length > keep) recent.shift();
  return w;
}

function choices(answer) {
  const seen = new Set([answer.ko]), picked = [];
  const cands = shuffle(pool.slice()).concat(shuffle(Object.values(FALLBACK).flat().map(w => ({ ko: w.meaning }))));
  for (const w of cands) {
    if (!seen.has(w.ko)) { seen.add(w.ko); picked.push(w.ko); }
    if (picked.length === 3) break;
  }
  return shuffle([answer.ko, ...picked]);
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
  speechSynthesis.speak(u);
}

function makeCard(w) {
  const opts = choices(w);
  qn++;
  const card = document.createElement('article');
  card.className = 'q';
  card.innerHTML =
    '<div class="q-head"><span class="num">' + qn + '</span>' +
    '<span class="word"></span>' +
    '<button type="button" class="say" aria-label="발음 듣기"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg></button></div>' +
    '<ol class="opts"></ol>';
  card.querySelector('.word').textContent = w.en;
  card.querySelector('.say').onclick = () => speak(w.en);
  const ol = card.querySelector('.opts');
  const btns = opts.map((ko, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'opt';
    b.innerHTML = '<span class="n">' + (i + 1) + '.</span><span class="t"></span><span class="ox" aria-hidden="true"></span>';
    b.querySelector('.t').textContent = ko;
    b.dataset.right = ko === w.ko ? '1' : '';
    b.onclick = () => answer(card, btns, b, ko === w.ko, w);
    li.appendChild(b); ol.appendChild(li);
    return b;
  });
  list.appendChild(card);
}

function answer(card, btns, chosen, right, w) {
  if (card.classList.contains('done')) return;
  card.classList.add('done');
  btns.forEach(b => { b.disabled = true; });
  const correctBtn = btns.find(b => b.dataset.right);
  correctBtn.classList.add('correct'); correctBtn.querySelector('.ox').textContent = 'O';
  if (!right) { chosen.classList.add('wrong'); chosen.querySelector('.ox').textContent = 'X'; }
  const m = document.createElement('span');
  m.className = 'mark ' + (right ? 'o' : 'x'); m.textContent = right ? 'O' : 'X';
  m.setAttribute('aria-label', right ? '정답' : '오답, 정답은 ' + w.ko);
  card.appendChild(m);
  right ? ok++ : no++;
  sO.textContent = ok; sX.textContent = no;
  sR.textContent = Math.round(ok / (ok + no) * 100) + '%';
}

async function addBatch() {
  if (adding) return;
  adding = true;
  const my = gen;
  try {
    for (let i = 0; i < BATCH; i++) {
      if (!queue.length) await fetchWords();
      if (my !== gen) return;
      if (!queue.length) break;
      makeCard(nextWord());
    }
    if (queue.length < 15) fetchWords();          // 미리 다음 단어 받아 두기
    more.textContent = qn ? '스크롤하면 문제가 계속 나와요' : '이 분류에는 아직 단어가 없어요';
  } finally { adding = false; }
}

async function start(lv) {
  gen++; loading = null; adding = false;
  level = cats.some(c => c.slug === lv) ? lv : cats[0].slug;
  pool = []; queue = []; recent = []; qn = 0; ok = 0; no = 0;
  sO.textContent = 0; sX.textContent = 0; sR.textContent = '-';
  list.innerHTML = ''; more.textContent = '단어를 불러오는 중…';
  nav.querySelectorAll('a').forEach(a => {
    if (a.dataset.level === level) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  await addBatch(); await addBatch();
}

new IntersectionObserver(es => { if (es[0].isIntersecting && level) addBatch(); }, { rootMargin: '800px' })
  .observe(more);
window.addEventListener('hashchange', () => start(location.hash.slice(1)));
document.getElementById('reset').onclick = () => start(level);
loadCategories().then(() => start(location.hash.slice(1)));
</script>
